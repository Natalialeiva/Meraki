<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Back Office | Meraki</title><style>body{font:16px system-ui;max-width:1100px;margin:auto;padding:2rem;background:#faf6f3;color:#382a34}input,select,button,textarea{font:inherit;padding:.6rem;margin:.3rem}article,section{padding:1rem;background:white;border-radius:12px;margin:1rem 0}button{cursor:pointer}pre{white-space:pre-wrap}</style><h1>Meraki · Gestión de reservas</h1><a href="/front-office/">Ver catálogo</a><p id="estado" role="status"></p><form id="login"><label>Correo <input name="correo" type="email" required autocomplete="username"></label><label>Contraseña <input name="password" type="password" required autocomplete="current-password"></label><button>Ingresar</button></form><main id="panel" hidden><button id="salir">Cerrar sesión</button><section><h2>Reservas</h2><label>Emprendimiento <select id="negocio"></select></label><button id="cargar">Actualizar</button><div id="reservas"></div></section><section><h2>Revisión de pagos</h2><form id="pago"><label>Número de abono <input name="id" type="number" min="1" required></label><button name="accion" value="estado">Consultar en Webpay</button><button name="accion" value="recuperar">Recuperar pago aprobado</button></form><pre id="resultadoPago"></pre></section><section><h2>Notificaciones</h2><p>Antes de resolver un envío interrumpido, verifica su entrega en el proveedor y registra la evidencia. Un resultado incierto debe permanecer en revisión.</p><button id="actualizar">Actualizar notificaciones</button><div id="notificaciones"></div></section></main><script src="back.js"></script></html>
